# Security testing pipeline for the quest Node.js/Express + Terraform project.
#
# Required GitHub Secrets:
#   CURSOR_API_KEY  - API key for the Cursor CLI security review job.
#                    The cursor-review job uses continue-on-error so the
#                    pipeline does not fail if this secret is absent.
#
# Recommended branch protection rules (Settings > Branches > main/master):
#   Require status checks: npm audit, Trivy filesystem scan, Trivy image scan,
#   Checkov IaC scan, Gitleaks secrets scan
#   Do NOT require: Cursor AI security review (continue-on-error / advisory)

name: Security

on:
  pull_request:
    branches:
      - master

# Minimal default permissions — jobs elevate only what they need.
permissions:
  contents: read

jobs:

  # ── 1. npm audit ─────────────────────────────────────────────────────────────
  # Checks Node.js dependencies for known CVEs.
  npm-audit:
    name: SCA npm audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '25'

      - name: Run npm audit
        run: npm audit --audit-level=critical

  # ── 2. Trivy Docker image scan ────────────────────────────────────────────────
  # Builds the Docker image then scans it for OS/library CVEs.
  # Runs after trivy-fs to avoid competing for runner resources during the build.
  trivy-image:
    name: Container Trivy image scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: docker build -t quest:${{ github.sha }} .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.28.0
        with:
          scan-type: image
          image-ref: quest:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          scanners: vuln

  # ── 4. Checkov — Terraform/IaC static analysis ───────────────────────────────
  # Scans tf/ for Terraform misconfigurations against CIS, NIST, and AWS benchmarks.
  #
  # skip_check baseline (tune after first run):
  #   CKV_AWS_91  - ALB access logging (acceptable for a demo project)
  #   CKV2_AWS_28 - WAF on ALB (out of scope)
  #
  # Additional checks you may need to skip on first run:
  #   CKV_AWS_65  - ECS Container Insights disabled (intentional in this project)
  #   CKV_AWS_97  - ECS task secrets in plaintext env (SECRET_WORD in main.tf)
  checkov:
    name: IAC Checkov scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: tf/
          framework: terraform
          soft_fail: false
          output_format: cli
          skip_check: CKV_AWS_91,CKV2_AWS_28,CKV_AWS_65,CKV_AWS_97

  # ── 5. Semgrep — JavaScript SAST ─────────────────────────────────────────────
  # Static analysis of src/ using Semgrep OSS with the javascript and
  # nodejs security rule packs. No account or token required.
  semgrep:
    name: SAST Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/javascript
          --config p/nodejs
          --error
          --no-rewrite-rule-ids
          src/

  # ── 6. Gitleaks — secrets detection ──────────────────────────────────────────
  # Scans the full git history and working tree for leaked credentials.
  # fetch-depth: 0 is required so Gitleaks can scan all commits, not just HEAD.
  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 7. OWASP ZAP — DAST baseline scan ───────────────────────────────────────
  # Builds the Docker image, starts the container, then runs the ZAP baseline
  # scan against the live app. Baseline mode crawls and checks for OWASP Top 10
  # issues without active attack payloads. fail_action: false is advisory.
  dast-zap:
    name: DAST OWASP ZAP baseline
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: docker build -t quest:${{ github.sha }} .

      - name: Start application container
        run: |
          docker run -d --name quest-app -p 3000:3000 quest:${{ github.sha }}
          echo "Waiting for app on :3000..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ && echo "App ready." && break
            sleep 1
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          artifact_name: zap-baseline-report

  # ── 8. Cursor AI security review ─────────────────────────────────────────────
  # Best-effort, non-blocking AI review using the Cursor CLI agent.
  # Requires CURSOR_API_KEY to be set as a repository secret.
  # continue-on-error: true means a missing key or API error will not block merges.
  # The review is posted as a PR comment and saved as a downloadable artifact.
  cursor-review:
    name: Cursor AI security review
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Run Cursor security review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent -p --force --output-format text \
            "Review the recent code changes and provide feedback on:
            - Code quality and readability
            - Potential bugs or issues
            - Security considerations
            - Best practices compliance
            Provide specific suggestions for improvement and write to review.txt"
          cat review.txt

      - name: Post review comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW=$(cat review.txt | head -c 64000)
          gh pr comment ${{ github.event.pull_request.number }} --body "## Cursor AI Security Review

          $REVIEW

          ---
          *Generated by Cursor AI · commit \`${{ github.sha }}\`*"

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-security-review
          path: review.txt
